name: heat-exchange

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: heat_exchange
      POSTGRES_USER: heat_app
      POSTGRES_PASSWORD: heat_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heat_app -d heat_exchange"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
